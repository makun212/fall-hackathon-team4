<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIロールプレイ学習ツール</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <main class="max-w-2xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">AIロールプレイ学習ツール</h1>
    <div id="chat" class="space-y-3 mb-4"></div>
    <form hx-post="/chat" hx-target="#chat" hx-swap="beforeend"
          hx-on::after-request="this.reset()" class="flex gap-2">
      <input name="message" required maxlength="500"
             placeholder="登場人物に話しかけてみよう"
             class="flex-1 border rounded px-3 py-2">
      <button class="bg-blue-600 text-white rounded px-4 py-2">送信</button>
    </form>
  </main>
</body>
</html>
